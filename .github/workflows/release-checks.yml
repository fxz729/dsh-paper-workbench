name: Release checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:library
      - run: npm run check:package
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-paper-workbench-package
          path: release/*
